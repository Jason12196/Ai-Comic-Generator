<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Comic Generator - 模型设置</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%); color: #111827; }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-purple-500">Settings</p>
        <h1 class="text-3xl font-bold mt-2">模型与 BYOK 设置</h1>
        <p class="text-sm text-gray-500 mt-2">在这里选择模式、填写各厂商 Key，并指定默认文本/图片模型。</p>
      </div>
      <a href="/index.html" class="inline-flex items-center gap-2 bg-black text-white px-4 py-2 rounded-xl text-sm font-bold">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        返回创作页
      </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <section class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm">
        <h2 class="text-lg font-bold mb-4">运行模式</h2>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">模式</label>
        <select id="apiModeSelect" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm">
          <option value="server">服务端托管</option>
          <option value="user">用户自带 Key</option>
        </select>
        <p id="modeHint" class="mt-3 text-sm text-gray-500"></p>
      </section>

      <section class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm">
        <h2 class="text-lg font-bold mb-4">默认模型</h2>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">文本模型</label>
        <select id="textModelInput" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm mb-4"></select>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">图片模型</label>
        <select id="imageModelInput" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm"></select>
        <p id="providerHint" class="mt-3 text-sm text-gray-500"></p>
      </section>
    </div>

    <section class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm mt-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold">各厂商 API Key</h2>
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">仅保存在本地浏览器</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">OpenAI</label>
          <input type="password" id="openaiApiKeyInput" placeholder="sk-..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Gemini</label>
          <input type="password" id="googleApiKeyInput" placeholder="AIza..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">DeepSeek</label>
          <input type="password" id="deepseekApiKeyInput" placeholder="DeepSeek Key" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Atlas Cloud</label>
          <input type="password" id="atlasApiKeyInput" placeholder="Atlas Key" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm">
        </div>
      </div>
      <div class="mt-6 flex items-center gap-3">
        <button id="saveBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-3 rounded-xl text-sm font-bold">保存设置</button>
        <span id="saveStatus" class="text-sm text-gray-500"></span>
      </div>
    </section>
  </div>

  <script>
    const API_BASE_URL = (
      location.hostname === "127.0.0.1" || location.hostname === "localhost"
    ) ? "http://127.0.0.1:3001/api" : "/api";
    let availableTextModels = [];
    let availableImageModels = [];
    let defaultTextModelKey = "openai.gpt-5.5";
    let defaultImageModelKey = "atlas.openai-gpt-image-2";

    async function apiRequest(path, options = {}) {
      const response = await fetch(`${API_BASE_URL}${path}`, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.success === false) throw new Error(data.message || `Request failed with status ${response.status}`);
      return data;
    }

    function renderSelect(selectId, models, fallback) {
      const select = document.getElementById(selectId);
      const saved = localStorage.getItem(selectId === "textModelInput" ? "aiComicTextModel" : "aiComicImageModel");
      select.innerHTML = models.map(model => `<option value="${model.key}">${model.displayName}</option>`).join("");
      select.value = saved && models.some(model => model.key === saved) ? saved : fallback;
    }

    function getModelByKey(key) {
      return [...availableTextModels, ...availableImageModels].find(model => model.key === key) || null;
    }

    function providerKey(provider) {
      if (provider === "openai") return document.getElementById("openaiApiKeyInput").value.trim();
      if (provider === "google") return document.getElementById("googleApiKeyInput").value.trim();
      if (provider === "deepseek") return document.getElementById("deepseekApiKeyInput").value.trim();
      if (provider === "atlas") return document.getElementById("atlasApiKeyInput").value.trim();
      return "";
    }

    function updateHints() {
      const mode = document.getElementById("apiModeSelect").value;
      const textModel = getModelByKey(document.getElementById("textModelInput").value || defaultTextModelKey);
      const imageModel = getModelByKey(document.getElementById("imageModelInput").value || defaultImageModelKey);
      document.getElementById("modeHint").textContent = mode === "server"
        ? "使用服务器预先配置的密钥，适合演示或统一部署。"
        : "使用你自己的厂商密钥，适合开源站点和个人调用。";
      document.getElementById("providerHint").textContent = `文本将使用 ${textModel?.provider || "unknown"}，图片将使用 ${imageModel?.provider || "unknown"}。`;
    }

    async function init() {
      const response = await apiRequest("/models");
      availableTextModels = response.data.textModels || [];
      availableImageModels = response.data.imageModels || [];
      defaultTextModelKey = response.data.defaultTextModelKey || defaultTextModelKey;
      defaultImageModelKey = response.data.defaultImageModelKey || defaultImageModelKey;

      document.getElementById("apiModeSelect").value = localStorage.getItem("aiComicApiMode") || "server";
      document.getElementById("openaiApiKeyInput").value = localStorage.getItem("aiComicOpenAIKey") || "";
      document.getElementById("googleApiKeyInput").value = localStorage.getItem("aiComicGoogleKey") || "";
      document.getElementById("deepseekApiKeyInput").value = localStorage.getItem("aiComicDeepSeekKey") || "";
      document.getElementById("atlasApiKeyInput").value = localStorage.getItem("aiComicAtlasKey") || "";

      renderSelect("textModelInput", availableTextModels, defaultTextModelKey);
      renderSelect("imageModelInput", availableImageModels, defaultImageModelKey);
      updateHints();
      lucide.createIcons();
    }

    function saveSettings() {
      localStorage.setItem("aiComicApiMode", document.getElementById("apiModeSelect").value);
      localStorage.setItem("aiComicOpenAIKey", document.getElementById("openaiApiKeyInput").value.trim());
      localStorage.setItem("aiComicGoogleKey", document.getElementById("googleApiKeyInput").value.trim());
      localStorage.setItem("aiComicDeepSeekKey", document.getElementById("deepseekApiKeyInput").value.trim());
      localStorage.setItem("aiComicAtlasKey", document.getElementById("atlasApiKeyInput").value.trim());
      localStorage.setItem("aiComicTextModel", document.getElementById("textModelInput").value);
      localStorage.setItem("aiComicImageModel", document.getElementById("imageModelInput").value);
      document.getElementById("saveStatus").textContent = "已保存，本地浏览器会记住这些设置。";
      updateHints();
    }

    window.addEventListener("DOMContentLoaded", init);
    document.addEventListener("change", (event) => {
      if (["apiModeSelect", "textModelInput", "imageModelInput"].includes(event.target.id)) updateHints();
    });
    document.addEventListener("click", (event) => {
      if (event.target.id === "saveBtn") saveSettings();
    });
  </script>
</body>
</html>
