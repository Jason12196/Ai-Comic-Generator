services:
  backend:
    build:
      context: ./backend
    container_name: ai-comic-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: always

  nginx:
    image: nginx:latest
    container_name: ai-comic-nginx
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./settings.html:/usr/share/nginx/html/settings.html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always
