        function selectPage(value) {
            document.getElementById('pageSelect').value = value;
            document.getElementById('pageBtnText').innerText = `x${value}`;
            document.getElementById('pageDropdown').classList.add('hidden');
            activeDropdowns = activeDropdowns.filter(d => d.id !== 'pageDropdown');
            saveStateToLocal();
        }

        function selectStyle(value, label) {
            document.getElementById('artStyleSelect').value = value;
            document.getElementById('styleBtnText').innerText = label;
            document.getElementById('styleDropdown').classList.add('hidden');
            activeDropdowns = activeDropdowns.filter(d => d.id !== 'styleDropdown');
            saveStateToLocal();
        }

        let customStyleCount = 0;
        
        function syncDropdownUI() {
            const ratioSelect = document.getElementById('aspectRatioSelect');
            const pageSelect = document.getElementById('pageSelect');
            const styleSelect = document.getElementById('artStyleSelect');
            
            if(ratioSelect && document.getElementById('ratioBtnText')) {
                const ratioText = ratioSelect.options[ratioSelect.selectedIndex]?.text || ratioSelect.value;
                document.getElementById('ratioBtnText').innerText = ratioSelect.value;
            }
            if(pageSelect && document.getElementById('pageBtnText')) {
                document.getElementById('pageBtnText').innerText = `x${pageSelect.value}`;
            }
            if(styleSelect && document.getElementById('styleBtnText')) {
                const styleText = styleSelect.options[styleSelect.selectedIndex]?.text || "自定义画风";
                document.getElementById('styleBtnText').innerText = styleText;
            }
        }

        function openCustomStyleModal() {
            document.getElementById('styleDropdown').classList.add('hidden');
            document.getElementById('settingsDropdown').classList.add('hidden');
            activeDropdowns = [];
            document.getElementById('customStyleModal').classList.remove('hidden');
            document.getElementById('customStyleText').value = '';
            removeCustomStyleImage();
        }

        function closeCustomStyleModal() {
            document.getElementById('customStyleModal').classList.add('hidden');
        }

        function saveCustomStyle() {
            const text = document.getElementById('customStyleText').value.trim();
            if (!text && !customStyleImageBase64) {
                alert("请填写画风描述或上传参考图片");
                return;
            }
            customStyleCount++;
            const styleLabel = `自定义画风 ${customStyleCount}`;
            const optionValue = text ? text : 'custom_image_only';
            
            const select = document.getElementById('artStyleSelect');
            const option = document.createElement('option');
            option.value = optionValue;
            option.text = styleLabel;
            select.appendChild(option);
            
            const dropdown = document.getElementById('styleDropdown');
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600 truncate';
            btn.innerText = styleLabel;
            btn.onclick = () => selectStyle(optionValue, styleLabel);
            
            const divider = dropdown.querySelector('.h-px');
            if (divider) {
                dropdown.insertBefore(btn, divider);
            } else {
                dropdown.appendChild(btn);
            }

            selectStyle(optionValue, styleLabel);
            closeCustomStyleModal();
        }

        // --- Task Management ---
        function saveCurrentTask() {
            if (!state.currentTaskId) return;
            let task = state.tasks.find(t => t.id === state.currentTaskId);
            if (!task) {
                task = { id: state.currentTaskId, createdAt: new Date().toLocaleString() };
                state.tasks.push(task);
            }
            
            const storyText = document.getElementById('storyInput').value.trim();
            let shortTitle = "Draft Task";
            if (storyText) {
                shortTitle = storyText.split(/[,.，。！?！\n]/)[0].substring(0, 10);
                if (storyText.length > 10) shortTitle += "...";
            }
            task.title = shortTitle;
            
            task.characters = [...state.characters];
            task.selectedCharacters = [...state.selectedCharacters];
            task.pages = document.getElementById('pageSelect').value;
            task.ratio = document.getElementById('aspectRatioSelect').value;
            task.style = document.getElementById('artStyleSelect').value;
            task.originalStory = storyText;
            task.expandedStory = state.expandedStory;
            task.hasGeneratedOnce = state.hasGeneratedOnce;
            task.executions = [...state.executions];
            task.generatedComicPages = state.generatedComicPages ? JSON.parse(JSON.stringify(state.generatedComicPages)) : null;
            return task;
        }

        function renderTasks() {
            const container = document.getElementById('dynamicTasksContainer');
            if (!container) return;
            let html = '';
            
            const sortedTasks = [...state.tasks].reverse();

            if (sortedTasks.length === 0) {
                container.innerHTML = `
                    <div class="task-card-glass rounded-[20px] px-5 py-6 text-center">
                        <div class="w-11 h-11 rounded-[18px] mx-auto mb-3 bg-white/80 border border-white/90 shadow-[0_10px_22px_rgba(130,142,177,0.1)] flex items-center justify-center text-[#9aa3bd]">
                            <i data-lucide="file-plus-2" class="w-4 h-4"></i>
                        </div>
                        <p class="text-sm font-bold text-[#63708e]">还没有任务</p>
                        <p class="text-[11px] text-[#a0a9bf] mt-1 leading-5">点击上方 New Task，新建一个真正的漫画创作任务。</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            sortedTasks.forEach(task => {
                const isActive = task.id === state.currentTaskId;
                let statusText = task.hasGeneratedOnce ? "Completed" : "Editing...";
                let statusColor = task.hasGeneratedOnce ? "text-green-500" : "text-purple-600";
                let iconColor = task.hasGeneratedOnce ? "text-green-600 bg-green-50" : "text-purple-600 bg-purple-50";
                let iconHtml = `<i data-lucide="sparkles" class="w-5 h-5"></i>`;
                
                if (task.isGenerating) {
                    statusText = "Generating...";
                    statusColor = "text-purple-600";
                    iconColor = "text-purple-600 bg-purple-50";
                    iconHtml = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`;
                }
                
                html += `
                    <div onclick="switchTask('${task.id}')" class="task-card-glass p-4 rounded-[20px] ${isActive ? 'border-[#8f84ff] bg-[#f8f7ff]' : 'hover:border-[#dbe2ef]'} cursor-pointer relative overflow-hidden group transition-colors">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-[18px] ${iconColor} flex items-center justify-center shrink-0">
                                ${iconHtml}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-sm font-extrabold text-[#1f2740] truncate">${task.title || 'Draft Task'}</h4>
                                <p class="text-[11px] ${statusColor} font-semibold">${statusText}</p>
                            </div>
                            <button onclick="event.stopPropagation(); deleteTask('${task.id}')" class="opacity-0 group-hover:opacity-100 text-[#9aa3ba] hover:text-red-500 transition-all shrink-0 w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#f6f8fc]">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        function deleteTask(taskId) {
            if (!confirm("确定要删除这个任务吗？")) return;
            
            const taskIndex = state.tasks.findIndex(t => t.id === taskId);
            if (taskIndex === -1) return;
            
            state.tasks.splice(taskIndex, 1);
            deleteTaskFromBackend(taskId);
            
            if (state.currentTaskId === taskId) {
                if (state.tasks.length > 0) {
                    // Switch to the most recent available task
                    const nextTaskId = state.tasks[state.tasks.length - 1].id;
                    state.currentTaskId = null; // force reload
                    switchTask(nextTaskId);
                } else {
                    // No tasks left, create a new empty one
                    createNewTask();
                }
            } else {
                // Just render the list if we deleted a background task
                renderTasks();
            }
            saveStateToLocal();
        }

        function switchTask(taskId) {
            if (taskId === state.currentTaskId) {
                return;
            }
            const previousTask = saveCurrentTask();
            if (previousTask) {
                scheduleTaskSync(cloneSerializable(previousTask), true);
            }
            const task = state.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            state.currentTaskId = taskId;
            state.characters = [...(task.characters || [])];
            state.selectedCharacters = [...(task.selectedCharacters || [])];
            state.expandedStory = task.expandedStory || "";
            state.hasGeneratedOnce = !!task.hasGeneratedOnce;
            state.executions = [...(task.executions || [])];
            state.currentExecutionId = state.executions.length > 0 ? state.executions[0].id : null;
            state.generatedComicPages = task.generatedComicPages ? JSON.parse(JSON.stringify(task.generatedComicPages)) : null;
            window.generatedComicPages = state.generatedComicPages;
            
            document.getElementById('storyInput').value = task.originalStory || "";
            document.getElementById('pageSelect').value = task.pages || "5";
            document.getElementById('aspectRatioSelect').value = task.ratio || "3:4";
            
            // Check if the saved style exists in the options, if not, add it as custom
            const styleSelect = document.getElementById('artStyleSelect');
            const savedStyle = task.style || "auto";
            let styleExists = Array.from(styleSelect.options).some(opt => opt.value === savedStyle);
            if (!styleExists && savedStyle !== "auto") {
                const option = document.createElement('option');
                option.value = savedStyle;
                option.text = "自定义画风";
                styleSelect.appendChild(option);
            }
            styleSelect.value = savedStyle;
            
            syncDropdownUI();
            
            document.getElementById('attachedCharacters').innerHTML = `
                <button type="button" id="addCharBtn" onclick="openModal()" class="w-16 h-16 rounded-[22px] border border-white/80 bg-white/62 shadow-[0_14px_26px_rgba(134,145,179,0.12)] flex flex-col items-center justify-center text-[#98a3bd] hover:bg-white hover:text-[#6f68ff] transition-colors">
                    <i data-lucide="plus" class="w-5 h-5 mb-1"></i>
                    <span class="text-[9px] font-bold uppercase tracking-wider">角色</span>
                </button>
            `;
            state.characters.forEach(char => {
                const isSelected = state.selectedCharacters.some(c => c.id === char.id);
                renderCharacterCard(char, isSelected);
            });
            
            const btn = document.getElementById('oneClickGenerateBtn');
            const status = document.getElementById('agentStatus');
            if (task.isGenerating) {
                btn.disabled = true;
                btn.classList.add('opacity-50');
                btn.innerHTML = `<span>生成中...</span><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>`;
                status.innerHTML = `<span class="agent-processing flex items-center gap-1.5"><i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> 后台正在生成中...</span>`;
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                if (state.hasGeneratedOnce) {
                    btn.innerHTML = `<span>修改故事/漫画</span><i data-lucide="edit-3" class="w-4 h-4"></i>`;
                } else {
                    btn.innerHTML = `<span>一键生成漫画</span><i data-lucide="sparkles" class="w-4 h-4"></i>`;
                }
                status.innerHTML = '';
            }
            
            const grid = document.getElementById('comicGrid');
            grid.innerHTML = '';
            renderExecutions();
            
            const availablePages = (state.executions && state.executions.length > 0)
                ? state.executions[0].pages
                : state.generatedComicPages;

            if (availablePages && availablePages.length > 0) {
                document.getElementById('welcomeState').classList.add('hidden');
                document.getElementById('expandedStoryBox').classList.add('hidden');
                document.getElementById('comicResultBox').classList.remove('hidden');
                document.getElementById('comicWrapper').classList.remove('hidden');
                document.getElementById('downloadFullComicBtn').classList.remove('hidden');
                document.getElementById('downloadZipBtn').classList.remove('hidden');

                window.generatedComicPages = JSON.parse(JSON.stringify(availablePages));
                state.generatedComicPages = window.generatedComicPages;

                const ratio = task.ratio || "3:4";
                renderComicGridPages(window.generatedComicPages, ratio);
            } else {
                document.getElementById('welcomeState').classList.remove('hidden');
                document.getElementById('expandedStoryBox').classList.add('hidden');
                document.getElementById('comicResultBox').classList.add('hidden');
            }
            
            renderTasks();
            syncWorkspaceMode();
            lucide.createIcons();
            
            const drawer = document.getElementById('configDrawer');
            drawer.classList.remove('-translate-x-full');
            drawer.classList.add('translate-x-0');
        }

        function createNewTask() {
            const previousTask = saveCurrentTask();
            if (previousTask) {
                scheduleTaskSync(cloneSerializable(previousTask), true);
            }
            
            const newTaskId = Date.now().toString();
            const newTask = {
                id: newTaskId,
                title: "Draft Task",
                createdAt: new Date().toLocaleString(),
                hasGeneratedOnce: false,
                executions: [],
                characters: [],
                selectedCharacters: [],
                pages: "5",
                ratio: "3:4",
                style: "auto",
                originalStory: "",
                expandedStory: "",
                generatedComicPages: null
            };
            state.tasks.push(newTask);
            
            // Only if switchTask wasn't modified to do this directly... wait, we can just call switchTask now, BUT switchTask needs the new task to be in `state.tasks`.
            // Wait, to force it to "switch" and clear out the old active state, we can temporarily clear `state.currentTaskId`
            const oldTaskId = state.currentTaskId;
            state.currentTaskId = null; // force reload UI
            switchTask(newTaskId);
            saveStateToLocal();
            syncWorkspaceMode();
        }

    </script>
</body>
</html>
