<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeShop AI - 漫画工作流</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --bg-strong: #eef2f7;
            --surface: #ffffff;
            --surface-strong: #ffffff;
            --surface-border: #e6ebf3;
            --surface-shadow: 0 8px 24px rgba(24, 32, 51, 0.04);
            --text: #182033;
            --muted: #6f7b94;
            --muted-soft: #9aa5bc;
            --accent: #5d63ff;
            --accent-soft: rgba(93, 99, 255, 0.08);
            --success: #6ab58c;
            --line: #e8edf5;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(180deg, #f7f9fc 0%, #f3f6fb 100%);
            color: var(--text);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(225, 231, 242, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(225, 231, 242, 0.5) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.18), transparent 92%);
            opacity: 0.28;
        }

        .display-serif {
            font-family: 'Instrument Serif', serif;
            letter-spacing: -0.03em;
        }

        .glass-panel {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            box-shadow: var(--surface-shadow);
        }

        .glass-panel-soft {
            background: #f8faff;
            border: 1px solid var(--surface-border);
            box-shadow: none;
        }

        .glass-button {
            background: #ffffff;
            border: 1px solid var(--surface-border);
            box-shadow: none;
        }

        .liquid-button {
            background: var(--accent);
            box-shadow: 0 10px 24px rgba(93, 99, 255, 0.18);
        }

        .task-card-glass {
            background: #ffffff;
            border: 1px solid var(--surface-border);
            box-shadow: none;
        }

        .char-dash-box {
            border: 1px dashed rgba(133, 122, 255, 0.38);
            background: rgba(255, 255, 255, 0.48);
            transition: all 0.3s ease;
        }
        
        .char-card-selected { border: 2px solid rgba(124, 113, 255, 0.92) !important; background-color: rgba(244, 242, 255, 0.98) !important; box-shadow: 0 10px 22px rgba(124, 113, 255, 0.18); }
        .char-card-selected .check-badge { display: flex !important; }

        .modal-overlay { background: rgba(17, 24, 39, 0.26); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .agent-processing { animation: pulse 1.6s infinite; color: #6f68ff; font-weight: 700; }
        .task-processing { animation: pulse 1.5s infinite; }

        .status-marquee {
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            mask-image: linear-gradient(90deg, transparent, black 10%, black 90%, transparent);
        }

        .status-marquee::after {
            content: "";
            position: absolute;
            top: 0;
            left: -30%;
            width: 28%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.72), transparent);
            animation: statusSweep 2.8s linear infinite;
            pointer-events: none;
        }

        .progress-liquid {
            position: relative;
            overflow: hidden;
        }

        .progress-liquid::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
            transform: translateX(-120%);
            animation: statusSweep 2.2s linear infinite;
        }

        .hero-chip {
            background: #f6f8fc;
            border: 1px solid var(--surface-border);
            box-shadow: none;
        }

        body.landing-mode #floatingInputBox {
            bottom: 8%;
            transform: translate(-50%, 0);
            max-width: 1040px;
        }

        body.landing-mode #welcomeState {
            opacity: 1;
            transform: translateY(0);
        }

        body:not(.landing-mode) #welcomeState {
            opacity: 0;
            transform: translateY(24px);
            pointer-events: none;
        }

        #welcomeState,
        #floatingInputBox {
            transition: opacity 0.45s ease, transform 0.45s ease, bottom 0.45s ease, box-shadow 0.45s ease;
        }

        .sidebar-scroll-section {
            content-visibility: auto;
            contain-intrinsic-size: 500px;
        }

        .cheap-glass {
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.86);
            box-shadow: 0 10px 24px rgba(120,132,166,0.08);
        }

        @media (prefers-reduced-motion: reduce) {
            .status-marquee::after,
            .progress-liquid::after,
            .agent-processing,
            .task-processing {
                animation: none !important;
            }
        }

        #agentStatus:empty {
            display: none;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.58; } 100% { opacity: 1; } }
        @keyframes statusSweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }
        @keyframes floatSoft { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body class="landing-mode flex h-screen">

    <!-- 任务列表侧边栏 -->
    <aside class="w-[320px] shrink-0 z-40 relative p-5">
        <div class="glass-panel h-full rounded-[28px] overflow-hidden flex flex-col">
            <div class="px-7 py-7 border-b border-white/60">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-11 h-11 rounded-2xl liquid-button flex items-center justify-center text-white text-xl font-bold">W</div>
                    <div>
                        <p class="text-sm text-[#66708c] font-semibold">任务工作台</p>
                    </div>
                </div>
                <button onclick="createNewTask()" class="w-full liquid-button text-white py-4 rounded-[20px] font-bold transition-all flex items-center justify-center gap-2 hover:opacity-95 active:opacity-90">
                    <i data-lucide="plus" class="w-4 h-4"></i> New Task
                </button>
            </div>
            <div class="px-7 py-5 flex items-center justify-between">
                <span class="text-[11px] font-extrabold text-[#98a1b8] uppercase tracking-[0.22em]">Recent Tasks</span>
            </div>
            <div class="flex-1 overflow-y-auto px-5 pb-6 space-y-3 no-scrollbar sidebar-scroll-section" id="taskListContainer">
                <div id="dynamicTasksContainer" class="space-y-3 mt-2"></div>
                
                <div class="pt-4 pb-2 flex items-center justify-between">
                    <span class="text-[11px] font-extrabold text-[#98a1b8] uppercase tracking-[0.22em]">History Cases</span>
                    <div class="h-px flex-1 mx-3 bg-gradient-to-r from-[#d9dff0] to-transparent"></div>
                </div>
                <div id="casesListContainer" class="space-y-3">
                </div>
            </div>
            <div class="px-7 py-5 border-t border-white/60 flex items-center text-[#a1a9be] text-xs font-semibold">
                云端任务会自动保存到当前账号
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative overflow-hidden p-5 pl-0">
        <div class="glass-panel h-full rounded-[28px] overflow-hidden flex flex-col relative">
        <header class="h-20 shrink-0 flex items-center justify-between px-10 gap-4 border-b border-[#e8edf5] bg-white sticky top-0 z-30">
            <div>
                <p class="text-[11px] uppercase tracking-[0.26em] text-[#97a1bd] font-extrabold mb-1">Workspace</p>
                <h1 class="text-[28px] font-bold text-[#1a2338] display-serif">Storyboard Atelier</h1>
            </div>
            
            <div class="flex items-center gap-6">

                <a href="/settings.html" class="glass-button flex items-center gap-2 rounded-[18px] px-4 py-3 text-xs font-bold text-[#4f5875] hover:text-[#2e3550] transition-colors">
                    <i data-lucide="sliders-horizontal" class="w-4 h-4 text-[#6b7696]"></i>
                    <span>模型设置</span>
                </a>
                <div id="providerHint" class="text-[11px] font-semibold text-[#8e97af] max-w-[260px] hidden xl:block truncate"></div>
                
                <div class="hero-chip text-[10px] font-extrabold text-[#57b07d] px-3 py-2 rounded-full uppercase tracking-[0.22em]">系统就绪</div>
                <div id="authUserChip" class="hidden hero-chip text-[11px] font-bold text-[#5d6785] px-4 py-2 rounded-full"></div>
                <button id="authActionButton" type="button" onclick="handleAuthAction()" class="glass-button rounded-[18px] px-4 py-3 text-xs font-bold text-[#4f5875] hover:text-[#2e3550] transition-colors">登录 / 注册</button>
                        </div>
        </header>

        <div class="hidden">
            <select id="apiModeSelect">
                <option value="server">服务端托管</option>
                <option value="user">用户自带 Key</option>
            </select>
            <div id="providerKeysBox"></div>
            <input type="password" id="openaiApiKeyInput">
            <input type="password" id="googleApiKeyInput">
            <input type="password" id="deepseekApiKeyInput">
            <input type="password" id="atlasApiKeyInput">
            <select id="textModelInput"></select>
            <select id="imageModelInput"></select>
            <div id="apiKeyStatusCheck"></div>
            <div id="apiKeyStatusError"></div>
            <div id="apiKeyLoading"></div>
        </div>

        <div class="flex-1 flex overflow-hidden">
            <!-- Center Canvas Area -->
            <div class="flex-1 overflow-y-auto relative flex flex-col items-center">
                <!-- Welcome State -->
                <div id="welcomeState" class="w-full max-w-4xl px-8 pt-16 pb-8 text-center relative z-10">
                    <h2 class="display-serif text-[52px] leading-[0.98] text-[#1b2540] mb-4">从一段故事<br>生成一部漫画</h2>
                    <div class="mt-4 flex items-center justify-center gap-3 flex-wrap">
                        <button onclick="clearHistory()" class="glass-button text-xs font-bold text-[#7a849d] hover:text-[#d45f76] transition-colors flex items-center gap-2 px-4 py-3 rounded-full">
                            <i data-lucide="trash-2" class="w-4 h-4"></i> 清除历史记录
                        </button>
                        <button onclick="saveAsCase()" class="glass-button text-xs font-bold text-[#7a849d] hover:text-[#6d73f8] transition-colors flex items-center gap-2 px-4 py-3 rounded-full">
                            <i data-lucide="star" class="w-4 h-4"></i> 保存为优秀案例
                        </button>
                        <button onclick="toggleInputHeight()" class="liquid-button text-xs font-bold text-white transition-colors flex items-center gap-2 px-5 py-3 rounded-full">
                            <i data-lucide="edit-3" class="w-4 h-4"></i> 开始创作
                        </button>
                    </div>
                </div>

                <!-- Expanded Story (Hidden by default) -->
                <div id="expandedStoryBox" class="hidden w-full max-w-4xl px-8 mt-8 mb-4 relative z-10">
                    <div class="glass-panel-soft p-6 rounded-[20px] animate-in fade-in">
                        <div class="flex items-center gap-2 mb-4 text-[#7369ff]">
                            <i data-lucide="wand-2" class="w-4 h-4"></i>
                            <span class="text-[11px] font-bold uppercase">AI 结构化故事大纲</span>
                        </div>
                        <div id="expandedContent"></div>
                    </div>
                </div>

                <!-- 最终生成的漫画展示区 -->
                <div id="comicResultBox" class="hidden w-full max-w-6xl px-8 pb-20 mt-4 flex-col items-center relative z-10">
                    <div class="flex justify-between items-center w-full mb-8">
                        <h3 class="text-[40px] display-serif text-[#1c2440]">最终成片</h3>
                        <div id="comicGenProgress" class="flex items-center gap-4 hidden">
                            <div class="w-72 h-3 bg-[#eef2f8] rounded-full overflow-hidden border border-[#e4e9f1]">
                                <div id="progressBar" class="progress-liquid h-full bg-[linear-gradient(90deg,#7d71ff_0%,#8aa4ff_100%)] w-0 transition-all duration-300 rounded-full"></div>
                            </div>
                            <span id="progressText" class="status-marquee text-xs font-bold text-[#6f68ff] uppercase w-40">生成中 0/4...</span>
                        </div>
                        <div class="flex gap-3">
                            <button type="button" id="downloadZipBtn" onclick="downloadAllPanels()" class="hidden glass-button hover:bg-white/80 text-[#4d5672] px-4 py-3 rounded-[18px] text-xs font-bold transition-all flex items-center gap-2">
                                <i data-lucide="folder-down" class="w-4 h-4"></i> 下载全部
                            </button>
                            <button type="button" id="downloadFullComicBtn" onclick="downloadFullComic()" class="hidden liquid-button text-white px-5 py-3 rounded-[18px] text-xs font-bold transition-all flex items-center gap-2">
                                <i data-lucide="image" class="w-4 h-4"></i> 导出长图
                            </button>
                        </div>
                    </div>
                    
                    <div id="executionsContainer" class="w-full mb-6 flex flex-col gap-2">
                        <!-- Executions list rendered here -->
                    </div>
                    
                    <div id="comicWrapper" class="w-full relative hidden flex justify-center">
                        <div id="comicGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full max-w-full">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Floating Input Box -->
            <div id="floatingInputBox" class="glass-panel absolute bottom-8 left-1/2 transform -translate-x-1/2 w-full max-w-4xl z-50 rounded-[24px] flex flex-col transition-all duration-300 overflow-hidden">
                <!-- 顶部：文本输入区 -->
                <div class="relative p-7 pb-3">
                    <textarea id="storyInput" class="w-full h-12 bg-transparent border-none p-0 text-[15px] text-[#212b44] placeholder-[#9ba5bd] focus:outline-none focus:ring-0 resize-none transition-all duration-300 scrollbar-hide leading-8" placeholder="输入一句故事、一个场景，或一段想法..."></textarea>
                    <button type="button" onclick="toggleInputHeight()" class="absolute top-6 right-6 text-[#98a3bd] hover:text-[#6f68ff] transition-colors bg-[#f6f8fc] rounded-full p-2">
                        <i data-lucide="maximize-2" id="expandIcon" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- 中部：角色列表 -->
                <div class="px-7 py-3 flex gap-3 flex-wrap items-center min-h-[60px]" id="attachedCharacters">
                    <button type="button" id="addCharBtn" onclick="openModal()" class="w-12 h-12 rounded-full bg-[#f6f8fc] hover:bg-[#eef2f8] flex items-center justify-center text-[#9aa4bc] hover:text-[#6f68ff] transition-colors shrink-0 border border-[#e6ebf3]">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- 底部：操作选项栏 -->
                <div class="px-7 py-5 flex items-center justify-between border-t border-[#e8edf5] bg-white">
                    <div class="flex items-center gap-3">
                        <!-- 设置图标 -->
                        <button type="button" class="text-[#95a1bb] hover:text-[#5d6785] transition-colors p-2 hover:bg-[#f6f8fc] rounded-2xl relative" onclick="toggleDropdown('settingsDropdown')">
                            <i data-lucide="settings-2" class="w-4 h-4"></i>
                        </button>
                        
                        <!-- 设置下拉菜单 (包含画风、模型) -->
                        <div class="relative" id="settingsDropdownContainer">
                            <div id="settingsDropdown" class="hidden absolute bottom-[120%] left-0 mb-2 w-64 bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-100 p-4 z-[60] origin-bottom-left animate-in fade-in zoom-in-95 duration-200">
                                <div class="space-y-4">
                                <div class="flex flex-col gap-2">
                                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">画面风格</span>
                                    <div class="relative w-full" id="styleDropdownInnerContainer">
                                        <button type="button" class="flex items-center justify-between w-full px-3 py-2 rounded-xl bg-gray-50 hover:bg-gray-100 text-xs font-bold text-gray-700 transition-colors" onclick="toggleDropdown('styleDropdown')">
                                            <span id="styleBtnText" class="truncate">自动匹配画风</span>
                                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0"></i>
                                        </button>
                                        <div id="styleDropdown" class="hidden absolute top-0 left-full ml-1 w-full bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-100 py-2 z-[70] animate-in fade-in zoom-in-95 duration-200 max-h-48 overflow-y-auto">
                                            <button type="button" onclick="selectStyle('auto', '自动匹配画风')" class="w-full text-left px-4 py-2 text-xs text-purple-600 bg-purple-50 font-bold">自动根据故事匹配</button>
                                            <button type="button" onclick="selectStyle('Japanese manga style, clean linework, cel shading, detailed backgrounds', '日系漫画')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">日系漫画</button>
                                            <button type="button" onclick="selectStyle('Western superhero comic style, dynamic inking, vibrant colors', '美式超级英雄')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">美式超级英雄</button>
                                            <button type="button" onclick="selectStyle('Gritty noir graphic novel style, high contrast black and white, heavy shadows', '黑色电影图画小说')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">黑色电影图画小说</button>
                                            <button type="button" onclick="selectStyle('Moebius style European comic, surreal colors, thin delicate lines', '欧式科幻')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">欧式科幻</button>
                                            <button type="button" onclick="selectStyle('Cinematic concept art style, painterly, realistic lighting', '电影概念艺术')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">电影概念艺术</button>
                                            <div class="h-px bg-gray-100 my-1"></div>
                                            <button type="button" onclick="openCustomStyleModal()" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600 flex items-center gap-2">
                                                <i data-lucide="plus" class="w-3 h-3"></i> 自定义画风...
                                            </button>
                                        </div>
                                        <select id="artStyleSelect" class="hidden">
                                            <option value="auto" selected>自动根据故事匹配</option>
                                            <option value="Japanese manga style, clean linework, cel shading, detailed backgrounds">日系漫画</option>
                                            <option value="Western superhero comic style, dynamic inking, vibrant colors">美式超级英雄</option>
                                            <option value="Gritty noir graphic novel style, high contrast black and white, heavy shadows">黑色电影图画小说</option>
                                            <option value="Moebius style European comic, surreal colors, thin delicate lines">欧式科幻</option>
                                            <option value="Cinematic concept art style, painterly, realistic lighting">电影概念艺术</option>
                                        </select>
                                    </div>
                                </div>
                                
                            </div>
                        </div>
                        </div>
                        
                        <!-- 比例选择 -->
                        <div class="relative" id="ratioDropdownContainer">
                            <button type="button" class="glass-button flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs font-bold text-[#5f6985] transition-colors" onclick="toggleDropdown('ratioDropdown')">
                                <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
                                <span id="ratioBtnText">16:9</span>
                            </button>
                            <div id="ratioDropdown" class="hidden absolute bottom-full left-0 mb-2 w-36 bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-100 py-2 z-50 origin-bottom-left animate-in fade-in zoom-in-95 duration-200">
                                <button type="button" onclick="selectRatio('1:1')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">1:1 正方形</button>
                                <button type="button" onclick="selectRatio('3:4')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">3:4 标准</button>
                                <button type="button" onclick="selectRatio('9:16')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">9:16 条漫</button>
                                <button type="button" onclick="selectRatio('16:9')" class="w-full text-left px-4 py-2 text-xs text-purple-600 bg-purple-50 font-bold">16:9 电影</button>
                            </div>
                            <select id="aspectRatioSelect" class="hidden">
                                <option value="1:1">1:1 正方形</option>
                                <option value="3:4">3:4 标准</option>
                                <option value="9:16">9:16 条漫</option>
                                <option value="16:9" selected>16:9 电影</option>
                            </select>
                        </div>

                        <!-- 页数选择 -->
                        <div class="relative" id="pageDropdownContainer">
                            <button type="button" class="glass-button flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs font-bold text-[#5f6985] transition-colors" onclick="toggleDropdown('pageDropdown')">
                                <i data-lucide="layers" class="w-3.5 h-3.5"></i>
                                <span id="pageBtnText">x1</span>
                            </button>
                            <div id="pageDropdown" class="hidden absolute bottom-full left-0 mb-2 w-32 bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-100 py-2 z-50 origin-bottom-left animate-in fade-in zoom-in-95 duration-200">
                                <button type="button" onclick="selectPage('1')" class="w-full text-left px-4 py-2 text-xs text-purple-600 bg-purple-50 font-bold">1 页</button>
                                <button type="button" onclick="selectPage('2')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">2 页</button>
                                <button type="button" onclick="selectPage('5')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">5 页</button>
                                <button type="button" onclick="selectPage('10')" class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-purple-50 hover:text-purple-600">10 页</button>
                            </div>
                            <select id="pageSelect" class="hidden">
                                <option value="1" selected>1 页</option>

    <script>
        lucide.createIcons();

        // --- 数据状态管理 ---
        let state = {
            tasks: [],
            currentTaskId: null,
            user: null,
            characters: [], 
            selectedCharacters: [], 
            pages: 5,
            ratio: "3:4",
            originalStory: "",
            expandedStory: "",
            generatedComicPages: null,
            hasGeneratedOnce: false,
            executions: [],
            currentExecutionId: null
        };
        let editingCharId = null;
        let editingCharIndex = -1;

        let customStyleImageBase64 = null;
        let customStyleImageMimeType = null;
        let availableTextModels = [];
        let availableImageModels = [];
        let defaultTextModelKey = 'google.gemini-3.1-flash-lite';
        let defaultImageModelKey = 'google.gemini-3-pro-image-preview';
        let authMode = 'login';
        let taskSyncTimer = null;
        let characterStatusTicker = null;

        function renderModelSelectOptions(selectId, models, savedValue) {
            const select = document.getElementById(selectId);
            if (!select) return;

            select.innerHTML = models.map(model => `<option value="${model.key}">${model.displayName}</option>`).join('');
            if (savedValue && models.some(model => model.key === savedValue)) {
                select.value = savedValue;
            } else if (models.length > 0) {
                select.value = models[0].key;
            }
        }

        async function loadAvailableModels() {
            const response = await apiRequest('/models');
            availableTextModels = response.data.textModels || [];
            availableImageModels = response.data.imageModels || [];
            defaultTextModelKey = response.data.defaultTextModelKey || defaultTextModelKey;
            defaultImageModelKey = response.data.defaultImageModelKey || defaultImageModelKey;

            renderModelSelectOptions('textModelInput', availableTextModels, localStorage.getItem('aiComicTextModel') || defaultTextModelKey);
            renderModelSelectOptions('imageModelInput', availableImageModels, localStorage.getItem('aiComicImageModel') || defaultImageModelKey);
            updateProviderHint();
        }

        function getModelByKeyFromCache(modelKey) {
            const normalizedModelKey = GEMINI_MODEL_KEY_MAP[modelKey] || modelKey;
            return [...availableTextModels, ...availableImageModels].find(model => model.key === normalizedModelKey) || null;
        }

        function getProviderKeyValue(provider) {
            if (provider === 'openai') return document.getElementById('openaiApiKeyInput').value.trim();
            if (provider === 'google') return document.getElementById('googleApiKeyInput').value.trim();
            if (provider === 'deepseek') return document.getElementById('deepseekApiKeyInput').value.trim();
            if (provider === 'atlas') return document.getElementById('atlasApiKeyInput').value.trim();
            return '';
        }

        function validateModelKeysForCurrentSelection() {
            const config = getModelConfig();
            if (config.mode !== 'user') {
                return null;
            }

            const textModel = getModelByKeyFromCache(config.textModelKey);
            const imageModel = getModelByKeyFromCache(config.imageModelKey);

            if (textModel && !config.textApiKey) {
                return `请填写 ${textModel.provider} 的文本模型 API Key`;
            }

            if (imageModel && !config.imageApiKey) {
                return `请填写 ${imageModel.provider} 的图片模型 API Key`;
            }

            return null;
        }

        function getModelConfig() {
            const mode = document.getElementById('apiModeSelect').value;
            const textModel = document.getElementById('textModelInput').value || defaultTextModelKey;
            const imageModel = document.getElementById('imageModelInput').value || defaultImageModelKey;
            const textModelConfig = getModelByKeyFromCache(textModel);
            const imageModelConfig = getModelByKeyFromCache(imageModel);
            const textApiKey = mode === 'user' && textModelConfig ? getProviderKeyValue(textModelConfig.provider) : '';
            const imageApiKey = mode === 'user' && imageModelConfig ? getProviderKeyValue(imageModelConfig.provider) : '';

            return {
                mode,
                apiKey: '',
                textApiKey,
                imageApiKey,
                textModelKey: textModel,
                imageModelKey: imageModel
            };
        }

        function syncApiModeUI() {
            const mode = document.getElementById('apiModeSelect').value;
            const providerKeysBox = document.getElementById('providerKeysBox');
            const textModelInput = document.getElementById('textModelInput');
            const imageModelInput = document.getElementById('imageModelInput');

            const userMode = mode === 'user';
            providerKeysBox.classList.toggle('hidden', !userMode);
            providerKeysBox.classList.toggle('flex', userMode);
            textModelInput.classList.toggle('hidden', !userMode);
            imageModelInput.classList.toggle('hidden', !userMode);
            updateProviderHint();
        }

        function updateProviderHint() {
            const hint = document.getElementById('providerHint');
            if (!hint) return;

            const mode = document.getElementById('apiModeSelect').value;
            if (mode !== 'user') {
                const imageModel = getModelByKeyFromCache(defaultImageModelKey);
                const textModel = getModelByKeyFromCache(defaultTextModelKey);
                hint.textContent = `服务端托管中：文本默认 ${textModel?.displayName || defaultTextModelKey}，图片默认 ${imageModel?.displayName || defaultImageModelKey}`;
                return;
            }

            const textModel = getModelByKeyFromCache(document.getElementById('textModelInput').value || defaultTextModelKey);
            const imageModel = getModelByKeyFromCache(document.getElementById('imageModelInput').value || defaultImageModelKey);
            hint.textContent = `当前将使用 ${textModel?.provider || 'unknown'} Key 生成文本，使用 ${imageModel?.provider || 'unknown'} Key 生成图片`;
        }

        function syncWorkspaceMode() {
            const storyValue = document.getElementById('storyInput')?.value?.trim() || '';
            const shouldUseLandingMode = !state.hasGeneratedOnce && storyValue.length === 0 && (state.characters || []).length === 0 && (state.executions || []).length === 0;
            document.body.classList.toggle('landing-mode', shouldUseLandingMode);
        }

        function cloneSerializable(value) {
            return JSON.parse(JSON.stringify(value));
        }

        function getStoredTaskState() {
            const savedState = localStorage.getItem('aiComicState');
            if (!savedState) {
                return { tasks: [], currentTaskId: null };
            }

            try {
                const parsedState = JSON.parse(savedState);
                if (parsedState.tasks && parsedState.tasks.length > 0) {
                    return {
                        tasks: parsedState.tasks,
                        currentTaskId: parsedState.currentTaskId || parsedState.tasks[0].id
                    };
                }

                const legacyTask = {
                    id: Date.now().toString(),
                    title: "Legacy Task",
                    createdAt: new Date().toLocaleString(),
                    hasGeneratedOnce: false,
                    executions: [],
                    characters: parsedState.characters || [],
                    selectedCharacters: parsedState.selectedCharacters || [],
                    pages: parsedState.pages || "5",
                    ratio: parsedState.ratio || "3:4",
                    style: parsedState.style || "auto",
                    originalStory: parsedState.originalStory || "",
                    expandedStory: parsedState.expandedStory || "",
                    generatedComicPages: parsedState.generatedComicPages || null
                };

                return {
                    tasks: [legacyTask],
                    currentTaskId: legacyTask.id
                };
            } catch (error) {
                console.log("Failed to restore state", error);
                return { tasks: [], currentTaskId: null };
            }
        }

        function normalizeTaskFromServer(taskRecord) {
            return {
                ...cloneSerializable(taskRecord.payload || {}),
                id: taskRecord.id,
                title: taskRecord.title,
                createdAt: taskRecord.createdAt,
                updatedAt: taskRecord.updatedAt
            };
        }

        async function maybeImportLocalTasksToCloud(localTaskState) {
            if (!state.user || !localTaskState.tasks.length) return [];

            const remoteResponse = await apiRequest('/tasks');
            const remoteTasks = (remoteResponse.data.tasks || []).map(normalizeTaskFromServer);
            if (remoteTasks.length > 0) {
                return remoteTasks;
            }

            for (const task of localTaskState.tasks) {
                await apiRequest('/tasks', {
                    method: 'POST',
                    body: JSON.stringify({ task })
                });
            }

            return localTaskState.tasks.map(cloneSerializable);
        }

        async function hydrateTasksFromSource(tasks, preferredTaskId = null) {
            state.tasks = tasks.map(cloneSerializable);
            if (state.tasks.length === 0) {
                createNewTask();
                return;
            }

            const nextTaskId = preferredTaskId && state.tasks.some(task => task.id === preferredTaskId)
                ? preferredTaskId
                : state.tasks[0].id;

            state.currentTaskId = null;
            switchTask(nextTaskId);
        }

        async function initializeTaskState() {
            const localTaskState = getStoredTaskState();

            if (state.user) {
                const remoteTasks = await maybeImportLocalTasksToCloud(localTaskState);
                if (remoteTasks.length > 0) {
                    await hydrateTasksFromSource(remoteTasks, localTaskState.currentTaskId);
                    return;
                }

                createNewTask();
                return;
            }

            if (localTaskState.tasks.length > 0) {
                await hydrateTasksFromSource(localTaskState.tasks, localTaskState.currentTaskId);
            } else {
                createNewTask();
            }
        }

        async function submitAuthForm() {
            const username = document.getElementById('authUsernameInput').value.trim();
            const password = document.getElementById('authPasswordInput').value;
            const submitButton = document.getElementById('authSubmitButton');

            if (!username || !password) {
                setAuthStatus('请先填写用户名和密码', true);
                return;
            }

            submitButton.disabled = true;
            setAuthStatus('正在连接你的云端工作台...');

            try {
                const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
                const response = await apiRequest(endpoint, {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                state.user = response.data.user;
                updateAuthUI();
                closeAuthModal();
                await initializeTaskState();
                renderTasks();
                setAuthStatus('');
            } catch (error) {
                setAuthStatus(error.message || '账号连接失败', true);
            } finally {
                submitButton.disabled = false;
            }
        }

        function scheduleTaskSync(task, immediate = false) {
            if (!state.user || !task || !task.id) return;

            const persist = async () => {
                try {
                    const response = await apiRequest('/tasks', {
                        method: 'POST',
                        body: JSON.stringify({ task })
                    });
                    const savedTask = normalizeTaskFromServer(response.data.task);
                    const targetIndex = state.tasks.findIndex(item => item.id === savedTask.id);
                    if (targetIndex !== -1) {
                        state.tasks[targetIndex] = savedTask;
                        if (savedTask.id === state.currentTaskId) {
                            state.currentTaskId = savedTask.id;
                        }
                        renderTasks();
                    }
                } catch (error) {
                    console.warn('Failed to sync task to backend', error);
                }
            };

            if (immediate) {
                if (taskSyncTimer) clearTimeout(taskSyncTimer);
                persist();
                return;
            }

            if (taskSyncTimer) clearTimeout(taskSyncTimer);
            taskSyncTimer = setTimeout(persist, 500);
        }

        function saveStateToLocal() {
            let currentTask = null;
            try {
                currentTask = saveCurrentTask();
                
                const attemptSave = (tasksToSave) => {
                    localStorage.setItem('aiComicState', JSON.stringify({
                        tasks: tasksToSave,
                        currentTaskId: state.currentTaskId
                    }));
                };

                try {
                    attemptSave(state.tasks.map(cloneSerializable));
                } catch(e) {
                    if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.message.includes('quota')) {
                        console.warn("Storage quota exceeded, stripping historical comic images first...");
                        let strippedTasks = state.tasks.map(t => ({
                            ...t,
                            executions: t.id === state.currentTaskId
                                ? (t.executions || []).slice(0, 1)
                                : [],
                            generatedComicPages: t.id === state.currentTaskId ? t.generatedComicPages || null : null,
                            characters: t.id === state.currentTaskId ? t.characters : t.characters.map(c => ({...c, avatar: null, designSheet: null, img: null})),
                            selectedCharacters: t.id === state.currentTaskId ? t.selectedCharacters : t.selectedCharacters.map(c => ({...c, avatar: null, designSheet: null, img: null}))
                        }));

                        try {
                            attemptSave(strippedTasks);
                        } catch (e2) {
                            console.warn("Storage quota still exceeded, stripping current execution images...");
                            strippedTasks = state.tasks.map(t => ({
                                ...t,
                                executions: [],
                                generatedComicPages: null,
                                characters: t.id === state.currentTaskId ? t.characters : t.characters.map(c => ({...c, avatar: null, designSheet: null, img: null})),
                                selectedCharacters: t.id === state.currentTaskId ? t.selectedCharacters : t.selectedCharacters.map(c => ({...c, avatar: null, designSheet: null, img: null}))
                            }));

                            try {
                                attemptSave(strippedTasks);
                            } catch (e3) {
                                console.warn("Storage quota still exceeded, stripping all images...");
                                strippedTasks = state.tasks.map(t => ({
                                    ...t,
                                    executions: [],
                                    generatedComicPages: null,
                                    characters: t.characters.map(c => ({...c, avatar: null, designSheet: null, img: null})),
                                    selectedCharacters: t.selectedCharacters.map(c => ({...c, avatar: null, designSheet: null, img: null}))
                                }));
                                attemptSave(strippedTasks);
                            }
                        }
                    } else {
                        throw e;
                    }
                }
            } catch(e) {
                console.warn("Could not save state completely", e);
            }

            if (currentTask) {
                scheduleTaskSync(cloneSerializable(currentTask));
            }
        }

        function saveAsCase() {
            const story = document.getElementById('storyInput').value.trim();
            if (!story) {
                alert("当前没有可保存的故事内容！");
                return;
            }
            
            // Generate a random seed for the icon
            const seeds = ["adventure", "cyber", "magic", "space", "fantasy", "hero", "mystery"];
            const randomSeed = seeds[Math.floor(Math.random() * seeds.length)] + Date.now();
            
            // Extract a short title (first 8 chars or up to the first punctuation)
            let shortTitle = story.split(/[,.，。！?！\n]/)[0].substring(0, 10);
            if (shortTitle.length === 0) shortTitle = "新灵感案例";
            else shortTitle += "...";

            // Get current state to save as a case
            const style = document.getElementById('artStyleSelect').value;
            const ratio = document.getElementById('aspectRatioSelect').value;
            const pages = document.getElementById('pageSelect').value;
            
            const newCase = {
                id: Date.now(),
                title: shortTitle,
                seed: randomSeed,
                state: {
                    originalStory: story,
                    ratio,
                    pages,
                    style,
                    characters: state.characters,
                    selectedCharacters: state.selectedCharacters
                    // Not saving the generated images to save localstorage space for cases
                }
            };
            
            // Get existing cases
            let savedCases = [];
            try {
                const existing = localStorage.getItem('aiComicCases');
                if (existing) savedCases = JSON.parse(existing);
            } catch(e) {}
            
            savedCases.unshift(newCase); // add to front
            localStorage.setItem('aiComicCases', JSON.stringify(savedCases));
            
            // Re-render cases
            renderCases();
            alert("已成功保存至灵感库！");
        }

            let html = '';

                casesContainer.innerHTML = `

        function loadCase(encodedState) {
            if (!confirm("加载案例将覆盖当前的输入与参数，确定要加载吗？")) return;
            
            try {
                const decodedState = JSON.parse(decodeURIComponent(encodedState));
                
                // Clear current
                state.characters = [];
                state.selectedCharacters = [];
                state.executions = [];
                state.hasGeneratedOnce = false;
                state.generatedComicPages = null;
                window.generatedComicPages = null;
                document.getElementById('attachedCharacters').innerHTML = `
                    <button type="button" id="addCharBtn" onclick="openModal()" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-purple-600 transition-colors shrink-0">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                `;
                document.getElementById('comicResultBox').classList.add('hidden');
                document.getElementById('expandedStoryBox').classList.add('hidden');
                
                // Restore inputs
                if (decodedState.originalStory) document.getElementById('storyInput').value = decodedState.originalStory;
                if (decodedState.ratio) document.getElementById('aspectRatioSelect').value = decodedState.ratio;
                if (decodedState.pages) document.getElementById('pageSelect').value = decodedState.pages;
                if (decodedState.style) {
                    const styleSelect = document.getElementById('artStyleSelect');
                    let styleExists = Array.from(styleSelect.options).some(opt => opt.value === decodedState.style);
                    if (!styleExists && decodedState.style !== "auto") {
                        const option = document.createElement('option');
                        option.value = decodedState.style;
                        option.text = "自定义画风";
                        styleSelect.appendChild(option);
                    }
                    styleSelect.value = decodedState.style;
                }
                
                syncDropdownUI();

                // Restore characters if any
                if (decodedState.characters && decodedState.characters.length > 0) {
                    decodedState.characters.forEach(char => {
                        if (char.avatar) {
                            state.characters.push(char);
                            const isSelected = decodedState.selectedCharacters && decodedState.selectedCharacters.some(c => c.id === char.id);
                            renderCharacterCard(char, isSelected);
                        }
                    });
                    
                    if (decodedState.selectedCharacters) {
                        state.selectedCharacters = decodedState.selectedCharacters;
                    }
                }
                
                const btn = document.getElementById('oneClickGenerateBtn');
                btn.innerHTML = `<span>一键生成漫画</span><i data-lucide="sparkles" class="w-4 h-4"></i>`;
                
                renderExecutions();

                lucide.createIcons();
                
            } catch(e) {
                console.error("加载案例失败", e);
                alert("加载案例失败");

                        clearTimeout(timer);
                        resolve(value);

                        reject(error);

            });

                            aspectRatio
                        }),
                        timeoutMs,
                        `Comic render page ${pageNumber} timed out after ${Math.round(timeoutMs / 1000)} seconds`

                    const image = result.images?.[0];
                    if (!image) {
                        throw new Error(`Comic render page ${pageNumber} returned no image`);
                    }

                    return result;
                } catch (error) {
                    lastError = error instanceof Error ? error : new Error('Unknown comic render error');
                    console.error(`Comic render page ${pageNumber} attempt ${attempt}/${maxAttempts} failed:`, lastError);

                    if (attempt === maxAttempts) {

        async function regenerateComicPageAtIndex(index, options = {}) {
            const pages = window.generatedComicPages || state.generatedComicPages || [];
            const page = pages[index];

            const ratio = options.ratio || document.getElementById('aspectRatioSelect').value || "3:4";
            const rawStyleOption = options.rawStyleOption || document.getElementById('artStyleSelect').value;
            let style = options.style || rawStyleOption;

            if (!options.style) {

                    const expandedStory = state.expandedStory;

                        const autoStyle = await callWorkflowTextModel(SYSTEM_PROMPTS.STYLE_AUTO_MATCH, `Story:\n${expandedStory}`);
                        style = autoStyle || "Japanese manga style";
                    } else {
                        style = "Japanese manga style";
                    }
                } else if (rawStyleOption === 'custom') {
                    style = document.getElementById('customStyleText').value || "Professional comic style";
                }
            }

            let charContextText = "CRITICAL CHARACTER REFERENCES:\n";
            (state.selectedCharacters || []).slice(0, 5).forEach((char, charIndex) => {
                charContextText += `- Character Name: "${char.name}". This is Reference Image ${charIndex + 1}. You MUST strictly copy their exact facial features, hair, clothing, etc.\n`;
            });
            const inlineDataParts = buildSelectedCharacterPromptParts(state.selectedCharacters || []);
            const previousReference = options.includePreviousReference === false
                ? null
                : (index > 0 ? (pages[index - 1]?.rawData || null) : null);

            const requestParts = buildComicPageRequestParts({
                page,
                style,
                charContextText,
                inlineDataParts,
                isCustomStyleWithImage: rawStyleOption === 'custom' && customStyleImageBase64,

            page.renderStatus = 'loading';

            if (options.fromViewer) {
                const btn = document.getElementById('viewerRegenBtn');
                const imgEl = document.getElementById('comicViewerImg');

                lucide.createIcons();

            try {
                const response = await generateComicRenderPageWithRetry({
                    prompt: buildComicPageScenePrompt(page, style, charContextText),
                    promptParts: requestParts,
                    aspectRatio: ratio,
                    pageNumber: page.page_number
                });
                const base64Image = response.images?.[0];
                if (!base64Image) {
                    throw new Error(`Page ${page.page_number} returned no image`);
                }
                const rawData = extractGeneratedInlineData(base64Image, response.raw) || (base64Image.startsWith('http') ? { imageUrl: base64Image } : null);

                page.imgData = base64Image;
                page.rawData = rawData;
                page.renderStatus = 'success';
                page.renderError = null;

                state.generatedComicPages = JSON.parse(JSON.stringify(pages));
                window.generatedComicPages = state.generatedComicPages;
                renderComicGridPages(window.generatedComicPages, ratio);

                const task = state.tasks.find(t => t.id === state.currentTaskId);
                if (task) {
                    task.generatedComicPages = JSON.parse(JSON.stringify(window.generatedComicPages));
                    if (task.executions && task.executions.length > 0) {
                        const activeExec = task.executions.find(exec => exec.id === state.currentExecutionId) || task.executions[0];
                        if (activeExec) {
                            activeExec.pages = JSON.parse(JSON.stringify(window.generatedComicPages));
                        }

                finalPrompt = promptTexts.length > 0 ? promptTexts.join('\n\n') : prompt;

                    apiKey: selection.textApiKey,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        ...contents
                    ],
                    params: forceJSON ? { responseMimeType: "application/json" } : undefined
                })
            });

            const text = response.data.text;
            if (!text) {
                throw new Error("No candidates returned from API");
            }
            return text;
        }

        async function callWorkflowImageModel({ prompt, promptParts, aspectRatio, modelKeyOverride, apiKeyOverride, requestKey }) {
            const keyError = validateModelKeysForCurrentSelection();
            if (keyError) {
                throw new Error(keyError);
            }

            const payload = buildImageRequestPayload({ prompt, promptParts, aspectRatio, modelKeyOverride, apiKeyOverride, requestKey });
                const response = await apiRequest('/models/generate-image', {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

            return response.data;
        }

        const makeModelTextRequest = callWorkflowTextModel;
        const makeModelImageRequest = callWorkflowImageModel;

        function buildSelectedCharacterPromptParts(selectedCharacters) {
            const parts = [];
            selectedCharacters.slice(0, 5).forEach((char, index) => {
                if (!char || !char.avatar) return;
                parts.push({
                    text: `Character Name: "${char.name || `Character ${index + 1}`}". This is Reference Image ${index + 1}. You MUST strictly copy their exact facial features, hair, clothing, etc.`
                });

                if (char.avatar.startsWith('data:')) {
                    const [metadata, data] = char.avatar.split(',', 2);
                    const mimeType = metadata.split(':')[1].split(';')[0];
                    parts.push({
                        inlineData: { mimeType, data }
                    });
                } else {
                    parts.push({
                        imageUrl: char.avatar
                    });
                }
            });
            return parts;
        }

        function buildCharacterDesignPromptSystem() {

Core Rule:
You must ALWAYS output a fully formed image generation prompt.
You are NOT allowed to output analysis, explanations, summaries, or meta commentary.

If the user provides no style, you must default to a professional concept art standard suitable for game, animation, or cinematic production.

The output must visually describe an image that is being rendered.

⸻

Default Rendering Standard (if unspecified)
Professional character turnaround sheet, clean light gray studio background, front/side/back alignment, subtle rim lighting, soft grounding shadow, ultra-detailed textures, cinematic clarity, industry-level concept art quality, ultra-high resolution, sharp focus.`;
        }

        async function requestCharacterDesignImage({
            name,
            description,
            uploadedBase64 = null,
            uploadedMimeType = null,
            preferredGoogleModel = null,
            requestKey = null
        }) {
            const selection = getRuntimeModelSelection();
            const selectedImageModel = getModelByKeyFromCache(selection.imageModelKey);
            const finalDesc = description === 'A basic character' ? 'A detailed character concept design' : description;

            const tryGenerate = async (useProModel = false) => {
                const currentModel = useProModel && selectedImageModel?.provider === 'google'
                    ? MODELS.IMAGE
                    : (preferredGoogleModel || selection.imageModelKey);

                const designPromptSystem = buildCharacterDesignPromptSystem();
                const designPromptParts = [{ text: `${designPromptSystem}\n\nCharacter Name: ${name}\nDescription: ${finalDesc}` }];
                if (uploadedBase64 && uploadedMimeType) {
                    designPromptParts.push({
                        inlineData: {
                            mimeType: uploadedMimeType,
                            data: uploadedBase64,
                        }
                    });
                }

                const result = await makeModelImageRequest({
                    prompt: `Character Name: ${name}. Description: ${finalDesc}.`,
                    promptParts: designPromptParts,
                    aspectRatio: "1:1",
                    modelKeyOverride: currentModel,
                    apiKeyOverride: selection.imageApiKey,
                    requestKey: requestKey ? `${requestKey}|${useProModel ? 'fallback' : 'primary'}` : undefined
                });

                const imageData = result.images?.[0];
                if (!imageData) {
                    throw new Error("Failed to generate design sheet image");
                }
                return {
                    imageData,
                    meta: result.meta || {}
                };
            };

            try {
                return await tryGenerate(false);
            } catch (err) {
                console.log("tryGenerate(false) caught error:", err, "message:", err.message);
                if (
                    err.message === "NO_IMAGE" ||
                    err.message.includes("Failed to generate design sheet image") ||
                    err.message.includes("Design API returned") ||
                    err.message.includes("Image generation failed")
                ) {
                    return await tryGenerate(true);
                }
                throw err;
            }
        }

        async function apiCharacterDesign(charObj) {
            const selection = getRuntimeModelSelection();
            const selectedImageModel = getModelByKeyFromCache(selection.imageModelKey);
            const usesGoogleImageModel = selectedImageModel?.provider === 'google';
            const requestKey = buildCharacterRequestKey({
                name: charObj.name,
                age: charObj.apparent_age_stage || '',
                gender: charObj.gender || '',
                species: charObj.species || '',
                role: charObj.role || '',
                personality: (charObj.core_traits || []).join(', '),
                appearance: (charObj.distinct_physical_traits || []).join(', '),
                outfit: '',
                background: '',
                otherTraits: charObj.visual_energy_profile || ''
            }, null, selection.imageModelKey);

            const tryGenerate = async (useProModel = false) => {
                const overrideModelKey = useProModel && usesGoogleImageModel
                    ? MODELS.IMAGE
                    : selection.imageModelKey;
                const prompt = `Generate a production-ready character turnaround sheet on a clean light gray studio background. IMPORTANT: You MUST output an image. DO NOT output text. NO WATERMARKS.
Character Name: ${charObj.name}
Role: ${charObj.role}
Gender: ${charObj.gender || 'Unknown'}
Species: ${charObj.species}
Age Stage: ${charObj.apparent_age_stage}
Physical Traits: ${(charObj.distinct_physical_traits || []).join(', ')}
Visual Energy: ${charObj.visual_energy_profile}`;
                const result = await makeModelImageRequest({
                    prompt,
                    aspectRatio: "1:1",
                    modelKeyOverride: overrideModelKey,
                    apiKeyOverride: selection.imageApiKey,
                    requestKey: `${requestKey}|${useProModel ? 'fallback' : 'primary'}`
                });
                const image = result.images?.[0];
                if (!image) {
                    throw new Error(`Character image generation returned no image for ${charObj.name}`);
                }
                return image;
            };

            try {
                return await tryGenerate(false);
            } catch (err) {
                console.log("apiCharacterDesign tryGenerate(false) caught error:", err, "message:", err.message);
                if (!usesGoogleImageModel) {
                    throw new Error(`Character design generation failed for ${charObj.name}: ${err.message}`);
                }

                try {
                    return await tryGenerate(true);
                } catch (secondError) {
                    throw new Error(`Character design generation failed for ${charObj.name}: ${secondError.message}`);
                }
            }
        }

                        lucide.createIcons();

                    let extractedChars = [];

                        const fullDesc = [
                            age ? `年龄: ${age}` : '',
                            gender ? `性别: ${gender}` : '',
                            species ? `物种: ${species}` : '',

                updateUI(() => {

        async function generateAvatarPreview() {
            const btn = document.getElementById('modalGenBtn');
            const regenBtn = document.getElementById('modalRegenBtn');
            const preview = document.getElementById('tempResultImg');
            const status = document.getElementById('charGenerationStatus');
            
            btn.innerText = "处理中...";
            btn.disabled = true;
            if (regenBtn) {
                regenBtn.innerText = "处理中...";
                regenBtn.disabled = true;
            }
            status.innerText = '正在生成角色设定图...';
            
            document.getElementById('manualUploadSection').classList.add('hidden');
            
            const formValues = getCharacterFormValues();
            const name = formValues.name || 'Unnamed';
            const desc = buildCharacterDescription(formValues) || 'A basic character';
            const requestKey = buildCharacterRequestKey(
                formValues,
                window.uploadedImageBase64 || null,
                getRuntimeModelSelection().imageModelKey
            );
            
            try {
                startCharacterGenerationTicker([
                    '正在提交角色设定请求...',
                    '模型正在生成角色设定图...',
                    '正在等待图片结果返回...',
                    '正在校验角色图片结果...'
                ]);

                const generation = await requestCharacterDesignImage({
                    name,
                    description: desc,
                    uploadedBase64: window.uploadedImageBase64 || null,
                    uploadedMimeType: window.uploadedImageMimeType || null,
                    preferredGoogleModel: MODELS.IMAGE_FAST,
                    requestKey
                });
                const imageData = generation.imageData;
                preview.src = imageData;
                window.lastGeneratedAvatar = imageData;
                window.lastGeneratedDesignSheet = imageData;
                const cacheStatus = generation.meta?.requestCacheStatus;
                if (cacheStatus === 'hit') {
                    setCharacterGenerationState('角色设定图已返回（命中缓存）', { tone: 'success' });
                } else if (cacheStatus === 'shared') {
                    setCharacterGenerationState('角色设定图已返回（复用进行中的请求）', { tone: 'success' });
                } else {
                    setCharacterGenerationState('角色设定图已生成', { tone: 'success' });
                }
            } catch (err) {
                console.error("API Error:", err);
                const errorMessage = err?.message || '未知错误';
                setCharacterGenerationState(`生成失败：${errorMessage}`, { tone: 'error' });
                alert("生成失败，API 报错请查看控制台: " + errorMessage);
                preview.classList.add('hidden');
                preview.removeAttribute('src');
                btn.classList.remove('hidden');
                document.getElementById('manualUploadSection').classList.remove('hidden');
                document.getElementById('modalConfirmActions').classList.add('hidden');
                btn.innerText = "生成角色设定图";
                btn.disabled = false;
                if (regenBtn) {
                    regenBtn.innerText = "重新生成当前角色";
                    regenBtn.disabled = false;
                }
                return;
            }
            
            preview.classList.remove('hidden');
            btn.classList.add('hidden');
            document.getElementById('modalConfirmActions').classList.remove('hidden');
            
            btn.innerText = "生成角色设定图";
            btn.disabled = false;
            if (regenBtn) {
                regenBtn.innerText = "重新生成当前角色";
                regenBtn.disabled = false;
            }
        }

                    if (card) {

            } else {
                const id = Date.now();
                const charData = {

                    name,
                    age: formValues.age,
                    gender: formValues.gender,
                    species: formValues.species,
                    role: formValues.role,
                    personality: formValues.personality,
                    appearance: formValues.appearance,
                    outfit: formValues.outfit,
                    background: formValues.background,
                    otherTraits: formValues.otherTraits,
                    desc,
                    avatar,
                    designSheet,
                    img: avatar
                };
                state.characters.push(charData);

                const grid = document.getElementById('attachedCharacters');
                const card = document.createElement('div');
                card.id = `char-card-${id}`;
                card.className = "relative w-16 h-16 rounded-2xl border-2 border-transparent bg-white p-0.5 flex flex-col items-center justify-center cursor-pointer transition-all overflow-hidden group shadow-sm char-card-selected";

                card.innerHTML = `
                    <div class="check-badge absolute top-1 right-1 w-4 h-4 bg-purple-600 rounded-full flex items-center justify-center z-10">
                        <i data-lucide="check" class="w-2.5 h-2.5 text-white"></i>

                        <span class="char-name-label text-[8px] font-bold text-white uppercase truncate w-full block">${name}</span>
                    </div>
                `;
                
                const addButton = document.getElementById('addCharBtn');
                if (addButton) {
                    grid.insertBefore(card, addButton);
                } else {
                    grid.appendChild(card);
                }

            lucide.createIcons();

        let activeDropdowns = [];

        function toggleDropdown(id) {
            const dropdown = document.getElementById(id);
            
            // 如果点击的是子菜单（如 styleDropdown）
            if (id === 'styleDropdown') {
            } else {
                // 这是一个主菜单（如 ratio, page, settings）
                activeDropdowns.forEach(d => {
                    if (d !== dropdown) d.classList.add('hidden');
                });
                activeDropdowns = [];
            }

            if (dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
                if (!activeDropdowns.includes(dropdown)) activeDropdowns.push(dropdown);
            } else {
                dropdown.classList.add('hidden');
                activeDropdowns = activeDropdowns.filter(d => d !== dropdown);
            }
        }

        document.addEventListener('click', (e) => {
            if (activeDropdowns.length > 0 && 
                !e.target.closest('#ratioDropdownContainer') && 
                !e.target.closest('#pageDropdownContainer') && 
                !e.target.closest('#settingsDropdownContainer') && 
                !e.target.closest('button[onclick^="toggleDropdown"]')) {
                activeDropdowns.forEach(d => d.classList.add('hidden'));
                activeDropdowns = [];
                document.getElementById('styleDropdown')?.classList.add('hidden');
